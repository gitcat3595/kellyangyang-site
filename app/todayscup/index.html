<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F4F5F4;
    --card-shadow: rgba(40,46,50,0.16);
    --ink: #383D40;
    --ink-faded: #9AA1A5;
    --rule: #DCE0E1;
    --accent: #6E7C82;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 16px;
    font-family:'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif;
    background-color:#E1E4E5;
  }

  .stage{
    width:100%;
    max-width:360px;
  }

  .card{
    position:relative;
    background:var(--paper);
    border-radius:2px;
    padding:20px 22px 18px 22px;
    box-shadow: 0 18px 38px var(--card-shadow);
    background-image:
      radial-gradient(ellipse 300px 220px at 88% 4%, rgba(110,124,130,0.10), transparent 65%),
      radial-gradient(ellipse 260px 240px at 6% 96%, rgba(110,124,130,0.11), transparent 65%),
      radial-gradient(ellipse 240px 200px at 20% 30%, rgba(110,124,130,0.06), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.045' numOctaves='5' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.9'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)' opacity='0.55'/></svg>");
    background-blend-mode: multiply, multiply, multiply, overlay, overlay;
  }

  .title{
    text-align:center;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-weight:700;
    font-size:13px;
    color:#9AA1A5;
    letter-spacing:0.22em;
    margin:0 0 6px 0;
  }

  .date-row-top{
    text-align:center;
    margin-bottom:22px;
  }
  .date-row-top .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.22em;
    color:#9AA1A5;
    outline:none;
  }

  .byline{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:center;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    color:var(--ink-faded);
    margin-bottom:26px;
    min-height:20px;
  }
  .byline .tea-name{
    display:inline-block;
    color:var(--ink);
    outline:none;
    border-radius:2px;
    padding:3px 5px;
    min-width:70px;
    text-align:left;
  }
  .byline .tea-name:empty:before{
    content:"tea name";
    color:var(--ink-faded);
    opacity:.35;
  }
  .byline .at-group{
    display:inline-flex;
    align-items:baseline;
    gap:3px;
  }
  .byline .at-symbol{
    color:var(--ink);
    user-select:none;
  }
  .byline .location{
    display:inline-block;
    outline:none;
    color:var(--ink);
    border-radius:2px;
    padding:3px 5px;
    min-width:60px;
    text-align:left;
  }

  /* faint tint on any field that's still empty, so it's clear where to tap */
  [contenteditable="true"]:empty{
    background:rgba(154,161,165,0.10);
  }
  [contenteditable="true"]:focus{
    background:transparent;
  }

  /* photo slot: square like a Hasselblad frame, with a retro white print border.
     Uses the padding-top square trick instead of aspect-ratio so the border
     never gets clipped on any mobile browser. Sized a touch smaller and
     centered so it doesn't dominate the card. */
  .photo-wrap{
    width:78%;
    margin:0 auto 26px auto;
  }
  .photo-slot{
    position:relative;
    width:100%;
    padding-top:100%;
    background:#FAFBFB;
    border:1px solid var(--rule);
    border-radius:2px;
  }
  .photo-slot .photo-pad{
    position:absolute;
    inset:9px;
  }
  .photo-slot .photo-inner{
    width:100%;
    height:100%;
    background:#E7EAEB;
    overflow:hidden;
    position:relative;
    touch-action:none;
    cursor:grab;
  }
  .photo-slot .photo-inner.dragging{ cursor:grabbing; }
  .photo-slot img{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    transform-origin:center center;
    user-select:none;
    -webkit-user-drag:none;
  }
  .photo-slot.has-image img{ display:block; }
  .photo-slot:not(.has-image) .photo-inner{ cursor:pointer; touch-action:auto; }

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--ink-faded);
  }
  .photo-slot.has-image .photo-placeholder{ display:none; }
  .photo-placeholder svg{ width:30px; height:30px; opacity:.5; }
  .photo-placeholder span{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
  }
  .photo-slot input[type=file]{ display:none; }

  .field-row{
    display:flex;
    gap:20px;
    margin-bottom:22px;
  }
  .field{ flex:1; }
  .field .label{
    display:block;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faded);
    margin-bottom:6px;
    opacity:0.85;
  }
  .field .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    color:var(--ink);
    outline:none;
    padding:3px 5px 6px 5px;
    margin:0 -5px;
  }
  .field .value:empty:before{ opacity:.4; }

  .memo{ margin-bottom:14px; }
  .memo .label{
    display:block;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faded);
    margin-bottom:8px;
    opacity:0.85;
  }
  .memo .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    outline:none;
    min-height:38px;
    padding:5px 5px 8px 5px;
    margin:0 -5px;
  }
  .memo .value:empty:before{
    content: attr(data-ph);
    color:var(--ink-faded);
    opacity:.4;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:12.5px;
  }

  .hint{
    text-align:center;
    margin-top:14px;
    font-family:'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif;
    font-size:11.5px;
    color:var(--ink-faded);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="title">TODAY'S CUP</div>

    <div class="date-row-top">
      <div class="value" contenteditable="true" id="dateField"></div>
    </div>

    <div class="byline">
      <span class="tea-name" id="teaName" contenteditable="true"></span><span class="at-group" id="atGroup"><span class="at-symbol" contenteditable="false">@</span><span class="location" id="location" contenteditable="true">somewhere</span></span>
    </div>

    <div class="photo-wrap" id="photoWrap">
      <div class="photo-slot" id="photoSlot">
        <div class="photo-pad">
          <div class="photo-inner" id="photoInner">
            <img id="photoImg" src="" alt="tea photo" draggable="false">
            <div class="photo-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1.5"/><circle cx="9" cy="12" r="2.2"/><path d="M3 17l5-4 4 3 4-5 5 6"/></svg>
              <span>TAP TO ADD PHOTO</span>
            </div>
          </div>
        </div>
        <input type="file" id="photoInput" accept="image/*">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <span class="label">Type</span>
        <div class="value" contenteditable="true" data-ph=""></div>
      </div>
      <div class="field">
        <span class="label">Origin</span>
        <div class="value" contenteditable="true" data-ph=""></div>
      </div>
    </div>

    <div class="memo">
      <span class="label">Taste note</span>
      <div class="value" contenteditable="true" data-ph="aroma, body, aftertaste..."></div>
    </div>
  </div>

  <div class="hint">tap any field to edit</div>
</div>

<script>
  // photo upload + finger pan/pinch-zoom (no visible controls, screenshot-friendly)
  const photoWrap = document.getElementById('photoWrap');
  const photoSlot = document.getElementById('photoSlot');
  const photoInner = document.getElementById('photoInner');
  const photoInput = document.getElementById('photoInput');
  const photoImg = document.getElementById('photoImg');

  let zoom = 1;
  let panX = 0, panY = 0;
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startPanX = 0, startPanY = 0;
  let pinchStartDist = 0, pinchStartZoom = 1;

  function clampPan(){
    const frame = photoInner.getBoundingClientRect();
    const maxOffset = (frame.width * (zoom - 1)) / 2;
    panX = Math.max(-maxOffset, Math.min(maxOffset, panX));
    panY = Math.max(-maxOffset, Math.min(maxOffset, panY));
  }

  function applyTransform(){
    clampPan();
    photoImg.style.transform = `translate(-50%, -50%) translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  function openPicker(){ photoInput.click(); }

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      photoImg.src = ev.target.result;
      photoSlot.classList.add('has-image');
      photoWrap.classList.add('has-image');
      zoom = 1; panX = 0; panY = 0;
      applyTransform();
    };
    reader.readAsDataURL(file);
  });

  function dist(t0, t1){
    const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function pointerDown(e){
    if(!photoSlot.classList.contains('has-image')) return;
    if(e.touches && e.touches.length === 2){
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = zoom;
      dragging = false;
      return;
    }
    dragging = true;
    moved = false;
    photoInner.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startPanX = panX; startPanY = panY;
  }

  function pointerMove(e){
    if(e.touches && e.touches.length === 2){
      const d = dist(e.touches[0], e.touches[1]);
      zoom = Math.max(1, Math.min(3, pinchStartZoom * (d / pinchStartDist)));
      applyTransform();
      if(e.cancelable) e.preventDefault();
      return;
    }
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    panX = startPanX + dx;
    panY = startPanY + dy;
    applyTransform();
    if(e.cancelable) e.preventDefault();
  }

  function pointerUp(){
    dragging = false;
    photoInner.classList.remove('dragging');
  }

  // tap opens the picker: always when empty, or when a tap (not a drag) on an existing photo
  photoInner.addEventListener('click', () => {
    if(!photoSlot.classList.contains('has-image') || !moved) openPicker();
  });

  photoInner.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  photoInner.addEventListener('touchstart', pointerDown, {passive:true});
  photoInner.addEventListener('touchmove', pointerMove, {passive:false});
  photoInner.addEventListener('touchend', pointerUp);

  // byline logic: hide "@ location" entirely when tea name is empty
  const teaName = document.getElementById('teaName');
  const atGroup = document.getElementById('atGroup');

  function syncByline(){
    const hasName = teaName.textContent.trim().length > 0;
    atGroup.style.display = hasName ? 'inline' : 'none';
  }
  teaName.addEventListener('input', syncByline);
  syncByline();

  // paste as plain text only, on every editable field (strips formatting/images)
  document.querySelectorAll('[contenteditable="true"]').forEach((el) => {
    el.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  });

  // default date
  const dateField = document.getElementById('dateField');
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  dateField.textContent = `${y}.${m}.${d}`;
</script>

</body>
</html>
