<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelly Yanagisawa</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23D7003A'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%231E50A2'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23E6B422'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23F2F2F3'/%3E%3C/svg%3E">
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Helvetica Neue","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --bg:#0a0a0b;--fg:#f4f4f5;--fg-2:#a2a2aa;--fg-3:#6a6a73;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.28);
}
@media (prefers-color-scheme:light){
  :root{--bg:#fff;--fg:#0c0c0e;--fg-2:#585862;--fg-3:#8b8b95;--line:rgba(0,0,0,.11);--line-2:rgba(0,0,0,.3)}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:grid;place-items:center;padding:32px 20px;line-height:1.5;
}
main{max-width:420px;width:100%}
.mark{display:flex;gap:4px;margin-bottom:28px}
.mark i{width:22px;height:22px;border-radius:4px;display:block}
h1{font-size:clamp(28px,7vw,38px);font-weight:620;letter-spacing:-.028em;line-height:1.1}
p{margin-top:12px;font-size:15px;color:var(--fg-2)}
nav{margin-top:32px;display:flex;gap:8px;flex-wrap:wrap}
a.btn{
  display:inline-flex;align-items:center;min-height:44px;padding:11px 18px;
  border:1px solid var(--line-2);border-radius:6px;text-decoration:none;color:var(--fg);
  font-size:14px;font-weight:520;transition:background-color .16s,border-color .16s;
}
a.btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
a.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <i style="background:#D7003A"></i><i style="background:#E6B422"></i>
    <i style="background:#007B43"></i><i style="background:#1E50A2"></i><i style="background:#7058A3"></i>
  </div>
  <h1>Kelly Yanagisawa</h1>
  <p>Small tools, built to be useful on their own.</p>
  <nav><a class="btn" href="/apps/">Apps →</a></nav>
  <footer>kellyangyang.com</footer>
</main>
</body>
</html>
