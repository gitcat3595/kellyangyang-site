<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script><script src="../auth.js?v=4"></script>
<title>Today's Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F4F5F4;
    --card-shadow: rgba(40,46,50,0.16);
    --ink: #383D40;
    --ink-faded: #9AA1A5;
    --rule: #DCE0E1;
    --accent: #6E7C82;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 16px;
    font-family:'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif;
    background-color:#E1E4E5;
  }

  .stage{
    width:100%;
    max-width:360px;
  }

  .card{
    position:relative;
    background:var(--paper);
    border-radius:2px;
    padding:20px 22px 18px 22px;
    box-shadow: 0 18px 38px var(--card-shadow);
    background-image:
      radial-gradient(ellipse 300px 220px at 88% 4%, rgba(110,124,130,0.10), transparent 65%),
      radial-gradient(ellipse 260px 240px at 6% 96%, rgba(110,124,130,0.11), transparent 65%),
      radial-gradient(ellipse 240px 200px at 20% 30%, rgba(110,124,130,0.06), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.045' numOctaves='5' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.9'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)' opacity='0.55'/></svg>");
    background-blend-mode: multiply, multiply, multiply, overlay, overlay;
  }

  .title{
    text-align:center;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-weight:700;
    font-size:13px;
    color:#9AA1A5;
    letter-spacing:0.22em;
    margin:0 0 6px 0;
  }

  .date-row-top{
    text-align:center;
    margin-bottom:22px;
  }
  .date-row-top .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.22em;
    color:#9AA1A5;
    outline:none;
  }

  .byline{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:center;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    color:var(--ink-faded);
    margin-bottom:26px;
    min-height:20px;
  }
  .byline .tea-name{
    display:inline-block;
    color:var(--ink);
    outline:none;
    border-radius:2px;
    padding:3px 5px;
    min-width:70px;
    text-align:left;
  }
  .byline .tea-name:empty:before{
    content:"tea name";
    color:var(--ink-faded);
    opacity:.35;
  }
  .byline .at-group{
    display:inline-flex;
    align-items:baseline;
    gap:3px;
  }
  .byline .at-symbol{
    color:var(--ink);
    user-select:none;
  }
  .byline .location{
    display:inline-block;
    outline:none;
    color:var(--ink);
    border-radius:2px;
    padding:3px 5px;
    min-width:60px;
    text-align:left;
  }

  /* faint tint on any field that's still empty, so it's clear where to tap */
  [contenteditable="true"]:empty{
    background:rgba(154,161,165,0.10);
  }
  [contenteditable="true"]:focus{
    background:transparent;
  }

  /* photo slot: square like a Hasselblad frame, with a retro white print border.
     Uses the padding-top square trick instead of aspect-ratio so the border
     never gets clipped on any mobile browser. Sized a touch smaller and
     centered so it doesn't dominate the card. */
  .photo-wrap{
    width:78%;
    margin:0 auto 26px auto;
  }
  .photo-slot{
    position:relative;
    width:100%;
    padding-top:100%;
    background:#FAFBFB;
    border:1px solid var(--rule);
    border-radius:2px;
  }
  .photo-slot .photo-pad{
    position:absolute;
    inset:9px;
  }
  .photo-slot .photo-inner{
    width:100%;
    height:100%;
    background:#E7EAEB;
    overflow:hidden;
    position:relative;
    touch-action:none;
    cursor:grab;
  }
  .photo-slot .photo-inner.dragging{ cursor:grabbing; }
  .photo-slot img{
    position:absolute;
    top:50%;
    left:50%;
    max-width:none;
    max-height:none;
    display:none;
    transform-origin:center center;
    user-select:none;
    -webkit-user-drag:none;
  }
  .photo-slot.has-image img{ display:block; }
  .photo-slot:not(.has-image) .photo-inner{ cursor:pointer; touch-action:auto; }

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--ink-faded);
  }
  .photo-slot.has-image .photo-placeholder{ display:none; }
  .photo-placeholder svg{ width:30px; height:30px; opacity:.5; }
  .photo-placeholder span{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
  }
  .photo-slot input[type=file]{ display:none; }

  .field-row{
    display:flex;
    gap:20px;
    margin-bottom:22px;
  }
  .field{ flex:1; }
  .field .label{
    display:block;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faded);
    margin-bottom:6px;
    opacity:0.85;
  }
  .field .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    color:var(--ink);
    outline:none;
    padding:3px 5px 6px 5px;
    margin:0 -5px;
  }
  .field .value:empty:before{ opacity:.4; }

  .memo{ margin-bottom:14px; }
  .memo .label{
    display:block;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-faded);
    margin-bottom:8px;
    opacity:0.85;
  }
  .memo .value{
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    outline:none;
    min-height:38px;
    padding:5px 5px 8px 5px;
    margin:0 -5px;
  }
  .memo .value:empty:before{
    content: attr(data-ph);
    color:var(--ink-faded);
    opacity:.4;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:12.5px;
  }

  /* action bar sits OUTSIDE the card so the card stays clean for screenshots */
  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
  }
  .actions .hint{
    flex:1;
    text-align:center;
    margin:0;
    font-family:'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif;
    font-size:11.5px;
    color:var(--ink-faded);
  }
  .act{
    -webkit-appearance:none;
    appearance:none;
    background:none;
    border:none;
    padding:6px;
    margin:0;
    cursor:pointer;
    color:var(--ink-faded);
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    line-height:1;
    display:inline-flex;
    align-items:center;
    transition:color .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .act:hover, .act:focus-visible{ color:var(--ink); outline:none; }
  .act:active{ opacity:.5; }
  .act svg{ width:19px; height:19px; display:block; }
  .act-group{ display:inline-flex; align-items:center; gap:2px; margin-left:-6px; }
  .act-clear{
    margin-right:-6px;
    white-space:nowrap;
    /* matches the hint beside it */
    font-family:'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif;
    font-size:11.5px;
    letter-spacing:normal;
  }
  .act[disabled]{ opacity:.35; pointer-events:none; }

  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%) translateY(8px);
    background:rgba(56,61,64,0.94);
    color:#F4F5F4;
    font-family:'Courier Prime', 'Zen Kaku Gothic New', 'Noto Sans SC', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    padding:9px 16px;
    border-radius:3px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="title">TODAY'S CUP</div>

    <div class="date-row-top">
      <div class="value" contenteditable="true" id="dateField"></div>
    </div>

    <div class="byline">
      <span class="tea-name" id="teaName" contenteditable="true"></span><span class="at-group" id="atGroup"><span class="at-symbol" contenteditable="false">@</span><span class="location" id="teaLocation" contenteditable="true">somewhere</span></span>
    </div>

    <div class="photo-wrap" id="photoWrap">
      <div class="photo-slot" id="photoSlot">
        <div class="photo-pad">
          <div class="photo-inner" id="photoInner">
            <img id="photoImg" src="" alt="tea photo" draggable="false">
            <div class="photo-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6" width="18" height="14" rx="1.5"/><circle cx="9" cy="12" r="2.2"/><path d="M3 17l5-4 4 3 4-5 5 6"/></svg>
              <span>TAP TO ADD PHOTO</span>
            </div>
          </div>
        </div>
        <input type="file" id="photoInput" accept="image/*">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <span class="label">Type</span>
        <div class="value" id="typeField" contenteditable="true" data-ph=""></div>
      </div>
      <div class="field">
        <span class="label">Origin</span>
        <div class="value" id="originField" contenteditable="true" data-ph=""></div>
      </div>
    </div>

    <div class="memo">
      <span class="label">Taste note</span>
      <div class="value" id="noteField" contenteditable="true" data-ph="aroma, body, aftertaste..."></div>
    </div>
  </div>

  <div class="actions">
    <div class="act-group">
      <button type="button" class="act act-share" id="shareBtn" aria-label="Share this ticket as an image" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V3.2"/><path d="M8 7.2l4-4 4 4"/><path d="M4.2 13v6a2 2 0 0 0 2 2h11.6a2 2 0 0 0 2-2v-6"/></svg>
      </button>
      <button type="button" class="act act-save" id="saveBtn" aria-label="Save this ticket as an image" title="Save image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v12.3"/><path d="M8 11.5l4 4 4-4"/><path d="M4.2 15v4a2 2 0 0 0 2 2h11.6a2 2 0 0 0 2-2v-4"/></svg>
      </button>
    </div>
    <div class="hint">tap to edit</div>
    <button type="button" class="act act-clear" id="clearBtn">CLEAR ALL</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // photo upload + finger pan/pinch-zoom (no visible controls, screenshot-friendly)
  const photoWrap = document.getElementById('photoWrap');
  const photoSlot = document.getElementById('photoSlot');
  const photoInner = document.getElementById('photoInner');
  const photoInput = document.getElementById('photoInput');
  const photoImg = document.getElementById('photoImg');

  let zoom = 1;
  let panX = 0, panY = 0;
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startPanX = 0, startPanY = 0;
  let pinchStartDist = 0, pinchStartZoom = 1;
  let natW = 0, natH = 0, baseScale = 1;

  // Size the image to *cover* the frame at its own aspect ratio, rather than
  // squashing it into a 100%x100% box. This is what makes sliding work at the
  // default zoom: a non-square photo genuinely overflows the square frame, so
  // there is real slack to drag through when choosing the crop.
  function layoutImage(){
    const frame = photoInner.getBoundingClientRect();
    if(!natW || !natH || !frame.width) return;
    baseScale = Math.max(frame.width / natW, frame.height / natH);
    photoImg.style.width  = (natW * baseScale) + 'px';
    photoImg.style.height = (natH * baseScale) + 'px';
    applyTransform();
  }

  function clampPan(){
    const frame = photoInner.getBoundingClientRect();
    const w = natW * baseScale * zoom;
    const h = natH * baseScale * zoom;
    const maxX = Math.max(0, (w - frame.width) / 2);
    const maxY = Math.max(0, (h - frame.height) / 2);
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }

  function applyTransform(){
    clampPan();
    photoImg.style.transform = `translate(-50%, -50%) translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  function openPicker(){ photoInput.click(); }

  photoImg.addEventListener('load', () => {
    natW = photoImg.naturalWidth;
    natH = photoImg.naturalHeight;
    zoom = 1; panX = 0; panY = 0;
    layoutImage();
  });

  window.addEventListener('resize', layoutImage);

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      photoImg.src = ev.target.result;
      photoSlot.classList.add('has-image');
      photoWrap.classList.add('has-image');
    };
    reader.readAsDataURL(file);
  });

  function dist(t0, t1){
    const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function pointerDown(e){
    if(!photoSlot.classList.contains('has-image')) return;
    if(e.touches && e.touches.length === 2){
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = zoom;
      dragging = false;
      return;
    }
    dragging = true;
    moved = false;
    photoInner.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startPanX = panX; startPanY = panY;
  }

  function pointerMove(e){
    if(e.touches && e.touches.length === 2){
      const d = dist(e.touches[0], e.touches[1]);
      zoom = Math.max(1, Math.min(3, pinchStartZoom * (d / pinchStartDist)));
      applyTransform();
      if(e.cancelable) e.preventDefault();
      return;
    }
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    panX = startPanX + dx;
    panY = startPanY + dy;
    applyTransform();
    if(e.cancelable) e.preventDefault();
  }

  function pointerUp(){
    dragging = false;
    photoInner.classList.remove('dragging');
  }

  // tap opens the picker: always when empty, or when a tap (not a drag) on an existing photo
  photoInner.addEventListener('click', () => {
    if(!photoSlot.classList.contains('has-image') || !moved) openPicker();
  });

  photoInner.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  photoInner.addEventListener('touchstart', pointerDown, {passive:true});
  photoInner.addEventListener('touchmove', pointerMove, {passive:false});
  photoInner.addEventListener('touchend', pointerUp);

  // byline logic: hide "@ location" entirely when tea name is empty
  const teaName = document.getElementById('teaName');
  const atGroup = document.getElementById('atGroup');

  function syncByline(){
    const hasName = teaName.textContent.trim().length > 0;
    atGroup.style.display = hasName ? 'inline' : 'none';
  }
  teaName.addEventListener('input', syncByline);
  syncByline();

  // paste as plain text only, on every editable field (strips formatting/images)
  document.querySelectorAll('[contenteditable="true"]').forEach((el) => {
    el.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  });

  // default date
  const dateField = document.getElementById('dateField');
  function todayStamp(){
    const t = new Date();
    const y = t.getFullYear();
    const m = String(t.getMonth()+1).padStart(2,'0');
    const d = String(t.getDate()).padStart(2,'0');
    return `${y}.${m}.${d}`;
  }
  dateField.textContent = todayStamp();

  // ---- share + clear ----
  const teaLocation = document.getElementById('teaLocation');
  const typeField   = document.getElementById('typeField');
  const originField = document.getElementById('originField');
  const noteField   = document.getElementById('noteField');
  const toast       = document.getElementById('toast');

  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  const val = (el) => el.textContent.trim();

  // ---- render the ticket to a PNG ----
  // Drawn by hand on a canvas rather than rasterising the DOM: SVG/foreignObject
  // export is unreliable on iOS Safari, which is the main place this gets used.
  // Layout constants below mirror the CSS above -- keep them in sync.
  const MONO = "'Courier Prime', monospace";
  const PAPER = '#F4F5F4', INK = '#383D40', FADED = '#9AA1A5', RULE = '#DCE0E1';
  const CARD_W = 360, PAD_X = 22, PAD_T = 20, PAD_B = 18, MARGIN = 20;

  // canvas has no letter-spacing in older Safari, so space glyphs manually
  function lsText(ctx, text, x, y, spacing, align){
    let total = 0;
    for(const ch of text) total += ctx.measureText(ch).width + spacing;
    total = Math.max(0, total - spacing);
    let cx = (align === 'center') ? x - total/2 : x;
    for(const ch of text){
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + spacing;
    }
    return total;
  }

  function wrapLines(ctx, text, maxW){
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for(const w of words){
      const test = line ? line + ' ' + w : w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    }
    if(line) lines.push(line);
    return lines;
  }

  async function renderTicket(scale){
    // make sure the webfonts are actually available to canvas
    try {
      await Promise.all([
        document.fonts.load("700 13px 'Courier Prime'"),
        document.fonts.load("400 14px 'Courier Prime'"),
        document.fonts.load("400 11px 'Courier Prime'")
      ]);
      await document.fonts.ready;
    } catch(e){ /* fall back to whatever is available */ }

    const contentW = CARD_W - PAD_X*2;
    const photoBox = Math.round(contentW * 0.78);

    // measure pass: find the card height before drawing
    const probe = document.createElement('canvas').getContext('2d');
    probe.font = `400 14px ${MONO}`;
    const noteLines = val(noteField) ? wrapLines(probe, val(noteField), contentW) : [];
    // these increments mirror the draw pass below exactly, so the bottom
    // padding comes out equal to the top rather than drifting
    const noteBlockH = noteLines.length ? (noteLines.length - 1) * 26 + 18 : 18;
    const cardH = PAD_T + 32 + 28 + 20 + 26 + photoBox + 26 + 43 + 22 + 25
                + noteBlockH + PAD_B;

    const W = CARD_W + MARGIN*2, H = Math.round(cardH) + MARGIN*2;
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textBaseline = 'alphabetic';

    // page backdrop
    ctx.fillStyle = '#E1E4E5';
    ctx.fillRect(0, 0, W, H);

    // card + soft shadow
    ctx.save();
    ctx.shadowColor = 'rgba(40,46,50,0.16)';
    ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    ctx.fillStyle = PAPER;
    ctx.fillRect(MARGIN, MARGIN, CARD_W, cardH);
    ctx.restore();

    // the three tinted washes from the CSS
    ctx.save();
    ctx.beginPath(); ctx.rect(MARGIN, MARGIN, CARD_W, cardH); ctx.clip();
    ctx.globalCompositeOperation = 'multiply';
    const washes = [[0.88,0.04,300,220,0.10],[0.06,0.96,260,240,0.11],[0.20,0.30,240,200,0.06]];
    for(const [fx,fy,rx,ry,a] of washes){
      const cx = MARGIN + CARD_W*fx, cy = MARGIN + cardH*fy;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1, ry/rx);
      const g = ctx.createRadialGradient(0,0,0,0,0,rx);
      g.addColorStop(0, `rgba(110,124,130,${a})`);
      g.addColorStop(0.65, 'rgba(110,124,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,0,rx,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // paper grain
    ctx.save();
    ctx.beginPath(); ctx.rect(MARGIN, MARGIN, CARD_W, cardH); ctx.clip();
    ctx.globalAlpha = 0.035;
    for(let i = 0; i < 5200; i++){
      const gx = MARGIN + Math.random()*CARD_W, gy = MARGIN + Math.random()*cardH;
      ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
      ctx.fillRect(gx, gy, 1, 1);
    }
    ctx.restore();

    const left = MARGIN + PAD_X, centre = MARGIN + CARD_W/2;
    let y = MARGIN + PAD_T;

    // title + date
    ctx.fillStyle = FADED;
    ctx.font = `700 13px ${MONO}`;
    y += 13;
    lsText(ctx, "TODAY'S CUP", centre, y, 13*0.22, 'center');
    y += 6 + 13;
    lsText(ctx, val(dateField), centre, y, 13*0.22, 'center');
    y += 22 + 6;

    // byline
    const tea = val(teaName), loc = val(teaLocation);
    if(tea){
      ctx.font = `400 14px ${MONO}`;
      const label = loc ? `${tea} @ ${loc}` : tea;
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      ctx.fillText(label, centre, y + 14);
      ctx.textAlign = 'left';
    }
    y += 20 + 26;

    // photo
    const px = MARGIN + PAD_X + (contentW - photoBox)/2;
    ctx.fillStyle = '#FAFBFB';
    ctx.fillRect(px, y, photoBox, photoBox);
    ctx.strokeStyle = RULE; ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, y + 0.5, photoBox - 1, photoBox - 1);
    const innerX = px + 10, innerY = y + 10, innerS = photoBox - 20;
    ctx.fillStyle = '#E7EAEB';
    ctx.fillRect(innerX, innerY, innerS, innerS);

    if(photoSlot.classList.contains('has-image') && natW && natH){
      // map the on-screen pan/zoom crop onto the exported frame
      const f = photoInner.getBoundingClientRect();
      const dw = natW * baseScale * zoom, dh = natH * baseScale * zoom;
      const x0 = (f.width - dw)/2 + panX, y0 = (f.height - dh)/2 + panY;
      const sx = (-x0) * (natW/dw), sy = (-y0) * (natH/dh);
      const sw = f.width * (natW/dw), sh = f.height * (natH/dh);
      ctx.save();
      ctx.beginPath(); ctx.rect(innerX, innerY, innerS, innerS); ctx.clip();
      try { ctx.drawImage(photoImg, sx, sy, sw, sh, innerX, innerY, innerS, innerS); }
      catch(e){ /* leave the empty frame */ }
      ctx.restore();
    }
    y += photoBox + 26;

    // type / origin
    const colW = (contentW - 20)/2;
    const cols = [[left, 'TYPE', val(typeField)], [left + colW + 20, 'ORIGIN', val(originField)]];
    for(const [cx, label, value] of cols){
      ctx.fillStyle = FADED;
      ctx.font = `400 11px ${MONO}`;
      ctx.globalAlpha = 0.85;
      lsText(ctx, label, cx, y + 11, 11*0.14, 'left');
      ctx.globalAlpha = 1;
      if(value){
        ctx.fillStyle = INK;
        ctx.font = `400 14px ${MONO}`;
        ctx.fillText(value, cx, y + 11 + 6 + 14);
      }
    }
    y += 17 + 6 + 20 + 22;

    // taste note
    ctx.fillStyle = FADED;
    ctx.font = `400 11px ${MONO}`;
    ctx.globalAlpha = 0.85;
    lsText(ctx, 'TASTE NOTE', left, y + 11, 11*0.14, 'left');
    ctx.globalAlpha = 1;
    y += 17 + 8;
    ctx.fillStyle = INK;
    ctx.font = `400 14px ${MONO}`;
    noteLines.forEach((ln, i) => ctx.fillText(ln, left, y + 14 + i*26));

    return cv;
  }

  function ticketFilename(){
    const tea = val(teaName).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const date = val(dateField).replace(/\./g,'');
    return `todays-cup-${date}${tea ? '-' + tea : ''}.png`;
  }

  function toBlob(cv){
    return new Promise((res) => cv.toBlob(res, 'image/png'));
  }

  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function withBusy(btn, fn){
    btn.disabled = true;
    try { await fn(); }
    catch(err){ showToast('could not make image'); }
    finally { btn.disabled = false; }
  }

  const shareBtn = document.getElementById('shareBtn');
  const saveBtn  = document.getElementById('saveBtn');

  // A web page cannot write into the iOS photo library on its own -- <a download>
  // lands in Files, not Photos. The only route to Photos is the native share
  // sheet, whose "Save Image" action files it there. So both buttons go through
  // the sheet whenever it can carry a file, and fall back to a plain download
  // on desktop and anywhere else that can't share files.
  async function deliverTicket(){
    const blob = await toBlob(await renderTicket(3));
    const name = ticketFilename();
    const file = new File([blob], name, { type: 'image/png' });
    // Hand over the image only — no title, text or url, so the sheet offers
    // Save to Photos rather than a link to this page.
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file] }); }
      catch(err){ if(err && err.name !== 'AbortError') showToast('could not share'); }
      return;
    }
    downloadBlob(blob, name);
    showToast('image saved');
  }

  saveBtn.addEventListener('click', () => withBusy(saveBtn, deliverTicket));
  shareBtn.addEventListener('click', () => withBusy(shareBtn, deliverTicket));

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(!confirm('Clear this ticket?')) return;
    teaName.textContent = '';
    teaLocation.textContent = 'somewhere';
    typeField.textContent = '';
    originField.textContent = '';
    noteField.textContent = '';
    dateField.textContent = todayStamp();

    photoImg.removeAttribute('src');
    photoImg.style.width = '';
    photoImg.style.height = '';
    photoSlot.classList.remove('has-image');
    photoWrap.classList.remove('has-image');
    photoInput.value = '';
    natW = natH = 0; baseScale = 1;
    zoom = 1; panX = 0; panY = 0;

    syncByline();
  });
</script>
