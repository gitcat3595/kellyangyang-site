<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Robot Learning - 小学生英文版</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    max-width: 900px;
    width: 100%;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 2.5em;
    color: #333;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 1.2em;
    color: #666;
    font-weight: normal;
}

.audio-status {
    margin-top: 15px;
    font-size: 0.95em;
    color: #667eea;
    font-weight: bold;
    height: 24px;
}

.lesson-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.lesson-btn {
    padding: 10px 15px;
    border: 2px solid #667eea;
    background: white;
    color: #667eea;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
}

.lesson-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
}

.lesson-btn.active {
    background: #667eea;
    color: white;
}

.animation-area {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    border-radius: 15px;
    padding: 40px;
    margin-bottom: 30px;
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100%;
    height: 250px;
}

.character {
    position: absolute;
    font-size: 60px;
    animation: float 3s ease-in-out infinite;
}

.robot {
    left: 20%;
    animation-delay: 0s;
}

.ai {
    right: 20%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-30px);
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.narration-box {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 30px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.chinese-text {
    font-size: 1.4em;
    color: #333;
    margin-bottom: 15px;
    line-height: 1.6;
    font-weight: 500;
    animation: slideIn 0.5s ease;
}

.english-highlight {
    font-size: 1.1em;
    color: #667eea;
    font-weight: bold;
    animation: slideIn 0.5s ease 0.3s backwards;
}

.english-highlight span {
    background: #e0e7ff;
    padding: 2px 6px;
    border-radius: 4px;
    margin: 0 3px;
}

.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary {
    background: #667eea;
    color: white;
}

.btn-primary:hover {
    background: #5568d3;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.btn-primary.active {
    background: #e74c3c;
}

.btn-primary.active:hover {
    background: #c0392b;
}

.btn-secondary {
    background: #f0f0f0;
    color: #333;
    border: 2px solid #ddd;
}

.btn-secondary:hover {
    background: #e8e8e8;
    transform: translateY(-2px);
}

.vocabulary {
    background: #fafafa;
    border-left: 4px solid #667eea;
    padding: 20px;
    border-radius: 10px;
}

.vocabulary h3 {
    color: #333;
    margin-bottom: 15px;
    font-size: 1.2em;
}

.vocab-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.vocab-item {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    border-left: 3px solid #667eea;
    cursor: pointer;
    transition: all 0.3s ease;
}

.vocab-item:hover {
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    transform: translateY(-2px);
}

.vocab-item.playing {
    background: #e0e7ff;
}

.vocab-chinese {
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
}

.vocab-english {
    font-size: 0.95em;
    color: #667eea;
    font-weight: bold;
    margin-bottom: 8px;
}

.vocab-definition {
    font-size: 0.85em;
    color: #666;
    margin-top: 5px;
    line-height: 1.4;
}

.vocab-audio-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 8px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 0.75em;
    cursor: pointer;
    font-weight: bold;
}

.vocab-audio-btn:hover {
    background: #5568d3;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    .header h1 {
        font-size: 1.8em;
    }

    .chinese-text {
        font-size: 1.1em;
    }

    .character {
        font-size: 40px;
    }

    .lesson-btn {
        padding: 8px 12px;
        font-size: 0.9em;
    }

    .btn {
        padding: 10px 18px;
        font-size: 0.9em;
    }
}
    </style>
</head>

        <div class="controls">

let currentLesson = 1;
let currentScene = 0;
let isPlaying = false;
let audioQueue = [];
let currentAudioIndex = 0;

const playSceneBtn = document.getElementById('playSceneBtn');
const stopBtn = document.getElementById('stopBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const chineseText = document.getElementById('chineseText');
const englishHighlight = document.getElementById('englishHighlight');
const vocabList = document.getElementById('vocabList');
const lessonBtns = document.querySelectorAll('.lesson-btn');
const audioStatus = document.getElementById('audioStatus');

function initLesson(lessonNum) {
    currentLesson = lessonNum;
    currentScene = 0;
    stopAudio();

    lessonBtns.forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-lesson="${lessonNum}"]`).classList.add('active');

    displayScene();
}

function displayScene() {
    const lesson = lessons[currentLesson];
    if (!lesson) return;

    const scene = lesson.scenes[currentScene];
    if (!scene) {
        chineseText.textContent = "课程完成！";
        englishHighlight.textContent = "Lesson Complete!";
        vocabList.innerHTML = '';
        return;
    }

    chineseText.textContent = scene.chinese;
    englishHighlight.innerHTML = scene.english;

    displayVocabulary(scene.vocab);
    animateCharacters();
}

function displayVocabulary(vocabItems) {
    vocabList.innerHTML = '';

    vocabItems.forEach((vocab, index) => {
        const vocabItem = document.createElement('div');
        vocabItem.className = 'vocab-item';
        vocabItem.id = `vocab-${index}`;
        vocabItem.innerHTML = `
            <div class="vocab-chinese">🇨🇳 ${vocab.cn}</div>
            <div class="vocab-english">🇬🇧 ${vocab.en}</div>
            <div class="vocab-definition">= ${vocab.def}</div>
            <button class="vocab-audio-btn" onclick="playVocabAudio(${currentLesson}, ${currentScene}, ${index})">🔊 播放</button>
        `;
        vocabList.appendChild(vocabItem);
    });
}

function animateCharacters() {
    const robot = document.getElementById('robot');
    const ai = document.getElementById('ai');

    robot.style.animation = 'none';
    ai.style.animation = 'none';

    setTimeout(() => {
        robot.style.animation = 'float 3s ease-in-out infinite';
        ai.style.animation = 'float 3s ease-in-out infinite 1s';
    }, 10);
}

function playSceneAudio() {
    if (isPlaying) {
        stopAudio();
        return;
    }

    const lesson = lessons[currentLesson];
    const scene = lesson.scenes[currentScene];
    if (!scene) return;

    isPlaying = true;
    playSceneBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    audioStatus.textContent = '🔊 播放中...';

    const speeches = [
        { text: scene.chinese, lang: 'zh-CN', rate: 0.9 },
        { text: scene.english.replace(/<[^>]*>/g, ''), lang: 'en-US', rate: 1 }
    ];

    playNextSpeech(speeches, 0);
}

function playNextSpeech(speeches, index) {
    if (!isPlaying || index >= speeches.length) {
        stopAudio();
        return;
    }

    const speech = speeches[index];
    const utterance = new SpeechSynthesisUtterance(speech.text);
    utterance.lang = speech.lang;
    utterance.rate = speech.rate;
    utterance.pitch = 1;

    utterance.onend = () => {
        playNextSpeech(speeches, index + 1);
    };

    utterance.onerror = () => {
        audioStatus.textContent = '❌ 音频播放出错';
        stopAudio();
    };

    speechSynthesis.speak(utterance);
}

function playVocabAudio(lessonNum, sceneNum, vocabIndex) {
    const vocab = lessons[lessonNum].scenes[sceneNum].vocab[vocabIndex];
    const vocabElement = document.getElementById(`vocab-${vocabIndex}`);

    if (isPlaying) {
        stopAudio();
        vocabElement.classList.remove('playing');
        return;
    }

    isPlaying = true;
    vocabElement.classList.add('playing');
    playSceneBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    audioStatus.textContent = `🔊 播放 ${vocab.cn}...`;

    const speeches = [
        { text: vocab.cn, lang: 'zh-CN', rate: 0.8 },
        { text: vocab.cn, lang: 'zh-CN', rate: 0.8 },
        { text: `${vocab.en}. Meaning: ${vocab.def}`, lang: 'en-US', rate: 0.95 },
        { text: vocab.example, lang: 'zh-CN', rate: 0.9 }
    ];

    playVocabSpeech(speeches, 0, vocabElement);
}

function playVocabSpeech(speeches, index, vocabElement) {
    if (!isPlaying || index >= speeches.length) {
        stopAudio();
        vocabElement.classList.remove('playing');
        return;
    }

    const speech = speeches[index];
    const utterance = new SpeechSynthesisUtterance(speech.text);
    utterance.lang = speech.lang;
    utterance.rate = speech.rate;

    utterance.onend = () => {
        playVocabSpeech(speeches, index + 1, vocabElement);
    };

    utterance.onerror = () => {
        stopAudio();
        vocabElement.classList.remove('playing');
    };

    speechSynthesis.speak(utterance);
}

function stopAudio() {
    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
    }
    isPlaying = false;
    playSceneBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    audioStatus.textContent = '';

    document.querySelectorAll('.vocab-item').forEach(item => {
        item.classList.remove('playing');
    });
}

function nextScene() {
    stopAudio();
    const lesson = lessons[currentLesson];
    if (currentScene < lesson.scenes.length - 1) {
        currentScene++;
        displayScene();
        playSceneAudio();
    } else if (currentLesson < 6) {
        currentLesson++;
        currentScene = 0;
        lessonBtns.forEach(btn => btn.classList.remove('active'));
        document.querySelector(`[data-lesson="${currentLesson}"]`).classList.add('active');
        displayScene();
        playSceneAudio();
    }
}

function prevScene() {
    stopAudio();
    if (currentScene > 0) {
        currentScene--;
        displayScene();
    } else if (currentLesson > 1) {
        currentLesson--;
        const lesson = lessons[currentLesson];
        currentScene = lesson.scenes.length - 1;
        lessonBtns.forEach(btn => btn.classList.remove('active'));
        document.querySelector(`[data-lesson="${currentLesson}"]`).classList.add('active');
        displayScene();
    }
}

playSceneBtn.addEventListener('click', playSceneAudio);
stopBtn.addEventListener('click', stopAudio);
nextBtn.addEventListener('click', nextScene);
prevBtn.addEventListener('click', prevScene);

lessonBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
        const lessonNum = parseInt(e.target.dataset.lesson);
        initLesson(lessonNum);
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextScene();
    if (e.key === 'ArrowLeft') prevScene();
});

initLesson(1);
    </script>
</body>
</html>
