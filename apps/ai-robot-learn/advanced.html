<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Robot Learning - Advanced 进阶版</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    max-width: 1000px;
    width: 100%;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 2.2em;
    color: #333;
    margin-bottom: 10px;
}

.level-selector {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 30px;
}

.level-btn {
    padding: 12px 24px;
    border: 2px solid #667eea;
    background: white;
    color: #667eea;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.1em;
    transition: all 0.3s ease;
}

.level-btn.active {
    background: #667eea;
    color: white;
}

.topic-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.topic-btn {
    padding: 10px 15px;
    border: 2px solid #764ba2;
    background: white;
    color: #764ba2;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
    font-size: 0.95em;
}

.topic-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
}

.topic-btn.active {
    background: #764ba2;
    color: white;
}

.animation-area {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 30px;
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.character {
    position: absolute;
    font-size: 50px;
    animation: float 3s ease-in-out infinite;
}

.robot {
    left: 15%;
    animation-delay: 0s;
}

.ai {
    right: 15%;
    animation-delay: 1s;
}

.tech-icon {
    font-size: 60px;
    opacity: 0.3;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-20px);
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.content-box {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
    border-left: 4px solid #667eea;
}

.chinese-text {
    font-size: 1.3em;
    color: #333;
    margin-bottom: 15px;
    line-height: 1.7;
    font-weight: 500;
    animation: slideIn 0.5s ease;
}

.english-text {
    font-size: 1em;
    color: #667eea;
    font-weight: bold;
    margin-bottom: 15px;
    animation: slideIn 0.5s ease 0.2s backwards;
}

.english-text span {
    background: #e0e7ff;
    padding: 3px 8px;
    border-radius: 4px;
    margin: 0 4px;
}

.phrase-box {
    background: white;
    border-left: 4px solid #764ba2;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.phrase-title {
    font-weight: bold;
    color: #764ba2;
    font-size: 1.05em;
    margin-bottom: 5px;
}

.phrase-chinese {
    font-size: 0.95em;
    color: #333;
    margin-bottom: 5px;
}

.phrase-english {
    font-size: 0.9em;
    color: #667eea;
    margin-bottom: 8px;
}

.phrase-explain {
    font-size: 0.85em;
    color: #666;
    line-height: 1.5;
}

.audio-controls {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    align-items: center;
}

.audio-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    background: #667eea;
    color: white;
    font-size: 0.95em;
}

.audio-btn:hover {
    background: #5568d3;
    transform: translateY(-2px);
}

.audio-btn.stop {
    background: #e74c3c;
}

.audio-btn.stop:hover {
    background: #c0392b;
}

.audio-status {
    font-size: 0.9em;
    color: #667eea;
    font-weight: bold;
}

.navigation {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 25px;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary {
    background: #667eea;
    color: white;
}

.btn-primary:hover {
    background: #5568d3;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #f0f0f0;
    color: #333;
    border: 2px solid #ddd;
}

.btn-secondary:hover {
    background: #e8e8e8;
    transform: translateY(-2px);
}

.vocabulary {
    background: #fafafa;
    border-left: 4px solid #667eea;
    padding: 20px;
    border-radius: 10px;
}

.vocabulary h3 {
    color: #333;
    margin-bottom: 15px;
    font-size: 1.15em;
}

.vocab-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
}

.vocab-item {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    border-left: 3px solid #667eea;
}

.vocab-chinese {
    font-size: 1em;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
}

.vocab-english {
    font-size: 0.92em;
    color: #667eea;
    font-weight: bold;
    margin-bottom: 5px;
}

.vocab-definition {
    font-size: 0.8em;
    color: #666;
    line-height: 1.4;
}

.example {
    font-size: 0.8em;
    color: #764ba2;
    margin-top: 8px;
    font-style: italic;
    padding-top: 8px;
    border-top: 1px solid #e0e7ff;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    .header h1 {
        font-size: 1.6em;
    }

    .chinese-text {
        font-size: 1.05em;
    }

    .level-btn {
        font-size: 0.9em;
        padding: 10px 18px;
    }

    .topic-btn {
        font-size: 0.85em;
        padding: 8px 12px;
    }
}
    </style>
</head>

            <p style="color: #666; margin-top: 10px;">Advanced AI & Technology Education</p>

        <div class="level-selector">

        <div class="navigation">

    </div>

let currentLevel = 'beginner';

let currentSection = 0;
let isSpeaking = false;

const levelBtns = document.querySelectorAll('.level-btn');
const topicSelector = document.getElementById('topicSelector');

const pauseAudioBtn = document.getElementById('pauseAudioBtn');

const englishText = document.getElementById('englishText');

const nextBtn = document.getElementById('nextBtn');

function initLevel(level) {
    currentLevel = level;
    currentTopic = 0;
    currentSection = 0;
    isSpeaking = false;

    levelBtns.forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-level="${level}"]`).classList.add('active');

    updateTopicSelector();
    displayContent();
}

function updateTopicSelector() {
    topicSelector.innerHTML = '';
    const levelData = contentData[currentLevel];

    levelData.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn' + (index === 0 ? ' active' : '');
        btn.textContent = `${item.icon} ${item.topic}`;
        btn.onclick = () => selectTopic(index);
        topicSelector.appendChild(btn);
    });
}

function selectTopic(index) {
    currentTopic = index;
    currentSection = 0;
    document.querySelectorAll('.topic-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
    displayContent();
}

function displayContent() {
    const levelData = contentData[currentLevel];
    const topic = levelData[currentTopic];
    const section = topic.sections[currentSection];

    if (!section) {
        chineseText.textContent = '课程完成！Lesson Complete!';
        englishText.textContent = '';
        phrasesContainer.innerHTML = '';
        vocabList.innerHTML = '';
        return;
    }

    techIcon.textContent = topic.icon;
    chineseText.textContent = section.chinese;
    englishText.innerHTML = section.english;

    phrasesContainer.innerHTML = '';
    section.phrases.forEach(phrase => {
        const phraseBox = document.createElement('div');
        phraseBox.className = 'phrase-box';
        phraseBox.innerHTML = `
            <div class="phrase-title">${phrase.title}</div>
            <div class="phrase-chinese">🇨🇳 ${phrase.chinese}</div>
            <div class="phrase-english">🇬🇧 ${phrase.english}</div>
            <div class="phrase-explain">📌 ${phrase.explain}</div>
        `;
        phrasesContainer.appendChild(phraseBox);
    });

    updateVocabulary();
    stopAudio();
}

function speakChineseText() {
    if (isSpeaking) {
        stopAudio();
        return;
    }

    const text = chineseText.textContent;
    if (!text) return;

    isSpeaking = true;
    playAudioBtn.style.display = 'none';
    pauseAudioBtn.style.display = 'inline-block';
    audioStatus.textContent = '🔊 播放中... Playing...';

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1;

    utterance.onend = () => {
        stopAudio();
    };

    utterance.onerror = () => {
        audioStatus.textContent = '音频播放出错 Audio error';
        stopAudio();
    };

    speechSynthesis.speak(utterance);
}

function stopAudio() {
    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
    }
    isSpeaking = false;
    playAudioBtn.style.display = 'inline-block';
    pauseAudioBtn.style.display = 'none';
    audioStatus.textContent = '';
}

function nextSection() {
    const levelData = contentData[currentLevel];
    const topic = levelData[currentTopic];

    if (currentSection < topic.sections.length - 1) {
        currentSection++;
        displayContent();
    } else if (currentTopic < levelData.length - 1) {
        currentTopic++;
        currentSection = 0;
        updateTopicSelector();
        displayContent();
    }
}

function prevSection() {
    if (currentSection > 0) {
        currentSection--;
        displayContent();
    } else if (currentTopic > 0) {
        currentTopic--;
        document.querySelectorAll('.topic-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === currentTopic);
        });
        const levelData = contentData[currentLevel];
        currentSection = levelData[currentTopic].sections.length - 1;
        displayContent();
    }
}

levelBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
        initLevel(e.target.dataset.level);
    });
});

playAudioBtn.addEventListener('click', speakChineseText);
pauseAudioBtn.addEventListener('click', stopAudio);
nextBtn.addEventListener('click', nextSection);
prevBtn.addEventListener('click', prevSection);

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSection();
    if (e.key === 'ArrowLeft') prevSection();
});

initLevel('beginner');
    </script>
</body>
</html>
